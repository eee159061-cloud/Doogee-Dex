name: Build Doogee DeX APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: android-actions/setup-android@v3
    - name: Build APK
      run: |
        mkdir -p app/src/main/java/com/doogee/desktop app/src/main/res/layout
        printf 'rootProject.name = "DoogeeDeX"\ninclude ":app"\n' > settings.gradle
        printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties
        printf 'buildscript {\n repositories { google(); mavenCentral() }\n dependencies {\n classpath "com.android.tools.build:gradle:8.2.2"\n classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22"\n }\n}\nallprojects { repositories { google(); mavenCentral() } }\n' > build.gradle
        printf 'plugins {\n id "com.android.application"\n id "org.jetbrains.kotlin.android"\n}\nandroid {\n namespace "com.doogee.desktop"\n compileSdk 34\n defaultConfig {\n applicationId "com.doogee.desktop"\n minSdk 26\n targetSdk 34\n versionCode 1\n versionName "1.0"\n }\n compileOptions {\n sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17\n }\n kotlinOptions { jvmTarget = "17" }\n}\ndependencies {\n implementation "androidx.appcompat:appcompat:1.6.1"\n}\n' > app/build.gradle
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://android.com">\n <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n <application android:label="Doogee DeX" android:theme="@style/Theme.AppCompat.NoActionBar">\n <activity android:name=".MainActivity" android:exported="true" android:resizeableActivity="true" android:screenOrientation="landscape">\n <intent-filter>\n <action android:name="android.intent.action.MAIN" />\n <category android:name="android.intent.category.LAUNCHER" />\n </intent-filter>\n </activity>\n </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<RelativeLayout xmlns:android="http://android.com" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#121820">\n <GridView android:id="@+id/appsGrid" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_above="@+id/taskbar" android:numColumns="6" android:verticalSpacing="16dp" android:horizontalSpacing="16dp" android:padding="20dp" android:gravity="center" />\n <LinearLayout android:id="@+id/taskbar" android:layout_width="match_parent" android:layout_height="48dp" android:layout_alignParentBottom="true" android:background="#1E2733" android:orientation="horizontal" android:gravity="center_vertical" android:paddingStart="16dp" android:paddingEnd="16dp">\n <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Doogee DeX" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" android:padding="8dp" android:background="#2B394A" />\n <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1" />\n <TextClock android:layout_width="wrap_content" android:layout_height="wrap_content" android:format12Hour="hh:mm a" android:textColor="#E0E6ED" android:textSize="15sp" />\n </LinearLayout>\n</RelativeLayout>\n' > app/src/main/res/layout/activity_main.xml
        printf 'package com.doogee.desktop\nimport android.app.ActivityOptions\nimport android.content.Intent\nimport android.os.Build\nimport android.os.Bundle\nimport android.view.*\nimport android.widget.*\nimport androidx.appcompat.app.AppCompatActivity\nclass MainActivity : AppCompatActivity() {\n override fun onCreate(savedInstanceState: Bundle?) {\n super.onCreate(savedInstanceState)\n setContentView(R.layout.activity_main)\n val appsGrid = findViewById<GridView>(R.id.appsGrid)\n val mainIntent = Intent(Intent.ACTION_MAIN, null).apply { addCategory(Intent.CATEGORY_LAUNCHER) }\n val appsList = packageManager.queryIntentActivities(mainIntent, 0).filter { it.activityInfo.packageName != packageName }.sortedBy { it.loadLabel(packageManager).toString().lowercase() }\n appsGrid.adapter = object : BaseAdapter() {\n override fun getCount() = appsList.size\n override fun getItem(p: Int) = appsList[p]\n override fun getItemId(p: Int) = p.toLong()\n override fun getView(p: Int, v: View?, parent: ViewGroup?): View {\n val layout = LinearLayout(this@MainActivity).apply { orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER; setPadding(8, 8, 8, 8) }\n val icon = ImageView(this@MainActivity).apply { layoutParams = LinearLayout.LayoutParams(100, 100); setImageDrawable(appsList[p].loadIcon(packageManager)) }\n val label = TextView(this@MainActivity).apply { text = appsList[p].loadLabel(packageManager); setTextColor(0xFFFFFFFF.toInt()); textSize = 13f; gravity = Gravity.CENTER; maxLines = 1; setPadding(0, 6, 0, 0) }\n layout.addView(icon); layout.addView(label); return layout\n }\n }\n appsGrid.setOnItemClickListener { _, _, p, _ ->\n val intent = packageManager.getLaunchIntentForPackage(appsList[p].activityInfo.packageName) ?: return@setOnItemClickListener\n intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)\n if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n val opts = ActivityOptions.makeBasic().apply { launchDisplayId = display?.displayId ?: 0 }\n startActivity(intent, opts.toBundle())\n } else startActivity(intent)\n }\n }\n}\n' > app/src/main/java/com/doogee/desktop/MainActivity.kt
        gradle assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: Doogee-DeX-APK
        path: app/build/outputs/apk/debug/app-debug.apk
