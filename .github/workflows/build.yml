name: Build Doogee DeX APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'
    - name: Generate and Build APK
      run: |
        mkdir -p app/src/main/java/com/doogee/desktop app/src/main/res/layout
        printf 'rootProject.name = "DoogeeDeX"\ninclude ":app"\n' > settings.gradle
        printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n' > gradle.properties
        printf 'plugins {\n id "com.android.application" version "8.2.2" apply false\n}\n' > build.gradle
        printf 'dependencyResolutionManagement {\n repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n repositories {\n google()\n mavenCentral()\n }\n}\nrootProject.name = "DoogeeDeX"\ninclude ":app"\n' > settings.gradle
        printf 'plugins {\n id "com.android.application"\n}\nandroid {\n namespace "com.doogee.desktop"\n compileSdk 34\n defaultConfig {\n applicationId "com.doogee.desktop"\n minSdk 26\n targetSdk 34\n versionCode 1\n versionName "1.0"\n }\n compileOptions {\n sourceCompatibility JavaVersion.VERSION_17\n targetCompatibility JavaVersion.VERSION_17\n }\n}\ndependencies {\n implementation "androidx.appcompat:appcompat:1.6.1"\n}\n' > app/build.gradle
        printf '<?xml version="1.0" encoding="utf-8"?>\n<manifest xmlns:android="http://android.com">\n <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />\n <application android:label="Doogee DeX" android:theme="@style/Theme.AppCompat.NoActionBar">\n <activity android:name=".MainActivity" android:exported="true" android:resizeableActivity="true" android:screenOrientation="landscape">\n <intent-filter>\n <action android:name="android.intent.action.MAIN" />\n <category android:name="android.intent.category.LAUNCHER" />\n </intent-filter>\n </activity>\n </application>\n</manifest>\n' > app/src/main/AndroidManifest.xml
        printf '<?xml version="1.0" encoding="utf-8"?>\n<RelativeLayout xmlns:android="http://android.com" android:layout_width="match_parent" android:layout_height="match_parent" android:background="#121820">\n <GridView android:id="@+id/appsGrid" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_above="@+id/taskbar" android:numColumns="6" android:verticalSpacing="16dp" android:horizontalSpacing="16dp" android:padding="20dp" android:gravity="center" />\n <LinearLayout android:id="@+id/taskbar" android:layout_width="match_parent" android:layout_height="48dp" android:layout_alignParentBottom="true" android:background="#1E2733" android:orientation="horizontal" android:gravity="center_vertical" android:paddingStart="16dp" android:paddingEnd="16dp">\n <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Doogee DeX" android:textColor="#FFFFFF" android:textSize="16sp" android:textStyle="bold" android:padding="8dp" android:background="#2B394A" />\n <View android:layout_width="0dp" android:layout_height="1dp" android:layout_weight="1" />\n <TextClock android:layout_width="wrap_content" android:layout_height="wrap_content" android:format12Hour="hh:mm a" android:textColor="#E0E6ED" android:textSize="15sp" />\n </LinearLayout>\n</RelativeLayout>\n' > app/src/main/res/layout/activity_main.xml
        printf 'package com.doogee.desktop;\nimport android.app.ActivityOptions;\nimport android.content.Intent;\nimport android.content.pm.PackageManager;\nimport android.content.pm.ResolveInfo;\nimport android.os.Build;\nimport android.os.Bundle;\nimport android.view.*;\nimport android.widget.*;\nimport androidx.appcompat.app.AppCompatActivity;\nimport java.util.*;\npublic class MainActivity extends AppCompatActivity {\n @Override\n protected void onCreate(Bundle savedInstanceState) {\n super.onCreate(savedInstanceState);\n setContentView(R.layout.activity_main);\n GridView appsGrid = findViewById(R.id.appsGrid);\n PackageManager pm = getPackageManager();\n Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);\n mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);\n List<ResolveInfo> rawList = pm.queryIntentActivities(mainIntent, 0);\n List<ResolveInfo> appsList = new ArrayList<>();\n for (ResolveInfo info : rawList) {\n if (!info.activityInfo.packageName.equals(getPackageName())) appsList.add(info);\n }\n Collections.sort(appsList, (a, b) -> a.loadLabel(pm).toString().compareToIgnoreCase(b.loadLabel(pm).toString()));\n appsGrid.setAdapter(new BaseAdapter() {\n @Override public int getCount() { return appsList.size(); }\n @Override public Object getItem(int p) { return appsList.get(p); }\n @Override public long getItemId(int p) { return p; }\n @Override public View getView(int p, View v, ViewGroup parent) {\n LinearLayout layout = new LinearLayout(MainActivity.this);\n layout.setOrientation(LinearLayout.VERTICAL);\n layout.setGravity(Gravity.CENTER);\n layout.setPadding(8, 8, 8, 8);\n ImageView icon = new ImageView(MainActivity.this);\n icon.setLayoutParams(new LinearLayout.LayoutParams(100, 100));\n icon.setImageDrawable(appsList.get(p).loadIcon(pm));\n TextView label = new TextView(MainActivity.this);\n label.setText(appsList.get(p).loadLabel(pm));\n label.setTextColor(0xFFFFFFFF);\n label.setTextSize(13f);\n label.setGravity(Gravity.CENTER);\n label.setMaxLines(1);\n label.setPadding(0, 6, 0, 0);\n layout.addView(icon);\n layout.addView(label);\n return layout;\n }\n });\n appsGrid.setOnItemClickListener((parent, view, p, id) -> {\n Intent intent = pm.getLaunchIntentForPackage(appsList.get(p).activityInfo.packageName);\n if (intent == null) return;\n intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && getDisplay() != null) {\n ActivityOptions opts = ActivityOptions.makeBasic();\n opts.setLaunchDisplayId(getDisplay().getDisplayId());\n startActivity(intent, opts.toBundle());\n } else {\n startActivity(intent);\n }\n });\n }\n}\n' > app/src/main/java/com/doogee/desktop/MainActivity.java
        gradle assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: Doogee-DeX-APK
        path: app/build/outputs/apk/debug/app-debug.apk
